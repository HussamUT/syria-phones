<!DOCTYPE html>

<style>
:root {
  --bg:#edeae3; --card:#fff; --card2:#f8f6f2;
  --ink:#161310; --muted:#6c6258; --pale:#b2a99e;
  --gold:#c8a43e; --green:#18965a; --red:#ce3b3b;
  --border:#e0dbd2; --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo','Tajawal',sans-serif;background:var(--bg);color:var(--ink);direction:rtl;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 50% at 5% 5%,rgba(200,164,62,.15) 0%,transparent 100%),
             radial-gradient(ellipse 50% 40% at 95% 95%,rgba(24,150,90,.09) 0%,transparent 100%);}
.page{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 18px 80px;}

/* HERO */
.hero{text-align:center;padding:48px 16px 26px;}
.live-badge{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:var(--gold);font-size:10.5px;font-weight:700;letter-spacing:2px;padding:5px 16px;border-radius:100px;margin-bottom:18px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 1.5s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}
h1{font-family:'Tajawal',sans-serif;font-size:clamp(32px,6vw,74px);font-weight:900;line-height:1.05;margin-bottom:8px;}
h1 em{font-style:normal;color:var(--gold);}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:20px;}

/* RATE PILL */
.rate-pill{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:8px 20px;border-radius:100px;margin-bottom:20px;flex-wrap:wrap;justify-content:center;}
.rl{color:var(--gold);font-size:10px;font-weight:700;letter-spacing:1.5px;}
.rv{font-family:'Tajawal',sans-serif;font-size:17px;font-weight:800;}
.ru{color:var(--gold);font-size:11px;}
.rdiv{width:1px;height:16px;background:rgba(255,255,255,.15);}
.ri{display:flex;flex-direction:column;align-items:flex-start;gap:1px;}
.rst{font-size:10px;color:rgba(255,255,255,.4);}
.rcd{font-size:10px;color:rgba(255,255,255,.25);font-family:'Tajawal',sans-serif;}
.spin{width:8px;height:8px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .75s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg)}}

/* SEARCH */
.sw{max-width:440px;margin:0 auto 13px;position:relative;}
.sw input{width:100%;padding:13px 44px 13px 18px;border:2px solid var(--border);border-radius:100px;background:var(--card);font-family:'Cairo',sans-serif;font-size:13.5px;color:var(--ink);outline:none;direction:rtl;transition:border-color .2s,box-shadow .2s;}
.sw input::placeholder{color:var(--pale);}
.sw input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,164,62,.13);}
.si{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none;}

/* FILTERS */
.filters{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;}
.fbtn{padding:6px 14px;border:2px solid var(--border);border-radius:100px;background:var(--card);font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s;}
.fbtn:hover,.fbtn.active{background:var(--ink);border-color:var(--ink);color:#fff;}

/* STATS */
.stats-bar{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;padding:13px 22px;background:var(--card);border-radius:14px;border:1px solid var(--border);max-width:560px;margin:0 auto 30px;box-shadow:0 2px 12px rgba(22,19,13,.06);}
.st{text-align:center;}
.stn{font-size:20px;font-weight:800;font-family:'Tajawal',sans-serif;}
.stl{font-size:10px;color:var(--muted);}
.sdiv{width:1px;height:28px;background:var(--border);}

/* 2-COL GRID */
.brands-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
@media(max-width:640px){.brands-grid{grid-template-columns:1fr;}}

/* CARD */
.brand-card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;box-shadow:0 2px 14px rgba(22,19,13,.06);transition:transform .28s cubic-bezier(.22,.68,0,1.2),box-shadow .28s;animation:fadeUp .45s ease both;}
.brand-card:hover{transform:translateY(-5px);box-shadow:0 14px 38px rgba(22,19,13,.11);}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* CARD HEADER */
.card-header{display:flex;align-items:center;gap:11px;padding:13px 16px 11px;border-bottom:1px solid var(--border);}
.brand-logo-img{height:26px;max-width:70px;object-fit:contain;display:block;flex-shrink:0;}
.brand-logo-fb{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;}
.brand-text{flex:1;min-width:0;}
.brand-name{font-size:15px;font-weight:800;font-family:'Tajawal',sans-serif;line-height:1.1;}
.brand-count{font-size:10px;color:var(--muted);}
.card-icon{font-size:28px;opacity:.07;flex-shrink:0;}

/* ══ PRICE TABLE ══
   table-layout:fixed + explicit col widths
   = headers ALWAYS aligned with data cells
*/
.price-table{width:100%;border-collapse:collapse;table-layout:fixed;}

/* fixed column widths */
.price-table col.cm{width:auto;}
.price-table col.cr{width:52px;}
.price-table col.cs{width:62px;}
.price-table col.cu{width:78px;}
.price-table col.ck{width:108px;}

/* header */
.price-table thead tr{background:var(--card2);border-bottom:2px solid var(--border);}
.price-table thead th{padding:6px 8px;font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;}
.thm{text-align:right;}
.thr{text-align:center;}
.ths{text-align:center;}
.thu{text-align:left;direction:ltr;}
.thk{text-align:left;direction:ltr;}

/* rows */
.price-table tbody tr{border-bottom:1px solid var(--border);transition:background .12s;}
.price-table tbody tr:last-child{border-bottom:none;}
.price-table tbody tr:hover{background:var(--card2);}
.price-table tbody tr.rh{display:none;}

/* cells */
.price-table td{padding:7px 8px;overflow:hidden;vertical-align:middle;}
.tdm{text-align:right;direction:ltr;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;}
.tdr{text-align:center;font-size:11px;color:var(--pale);white-space:nowrap;}
.tds{text-align:center;font-size:11px;color:var(--pale);white-space:nowrap;}
.tdu{text-align:left;direction:ltr;font-size:13px;font-weight:800;font-family:'Tajawal',sans-serif;white-space:nowrap;}
.tdk{text-align:left;direction:ltr;white-space:nowrap;}

/* SYP cell contents */
.syp-inner{display:inline-flex;align-items:center;gap:2px;}
.arr{font-size:11px;font-weight:900;line-height:1;flex-shrink:0;}
.arr.up{color:var(--green);}
.arr.down{color:var(--red);}
.arr.same{color:var(--pale);}
.syp-num{font-size:11.5px;font-weight:700;font-family:'Tajawal',sans-serif;color:var(--muted);}

/* SHOW MORE */
.more-btn{width:100%;padding:10px;border:none;border-top:1px solid var(--border);background:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;transition:background .15s;}
.more-btn:hover{background:var(--card2);}

.no-results{text-align:center;padding:50px 20px;color:var(--muted);display:none;}
</style>
</head>

/* ══ RATE ══ */
let RATE = 13500;
let cdTimer = null;

async function fetchRate() {
  document.getElementById('rateSpin').style.display = '';
  const sources = [
    async () => {
      const r = await fetch('https://open.er-api.com/v6/latest/USD',{signal:AbortSignal.timeout(7000)});
      const d = await r.json();
      return (d.result==='success' && d.rates?.SYP > 8000) ? d.rates.SYP : null;
    },
    async () => {
      const u = encodeURIComponent('https://sp-today.com/');
      const r = await fetch('https://api.allorigins.win/raw?url='+u,{signal:AbortSignal.timeout(8000)});
      const h = await r.text();
      for (const pat of [/الدولار[^٠-٩\d]*([\d,]+)/,/\b(1[2-9]\d{3}|[23]\d{4})\b/]) {
        const m = h.match(pat);
        if (m) { const v=parseFloat(m[1].replace(/,/g,'')); if(v>8000&&v<600000) return v; }
      }
      return null;
    }
  ];
  for (const src of sources) {
    try {
      const v = await src();
      if (v) {
        RATE = v;
        document.getElementById('rateNum').textContent = Math.round(v).toLocaleString('en-US');
        document.getElementById('rateSt').textContent  = '✓ محدّث';
        document.getElementById('rateSpin').style.display = 'none';
        refreshSYP(); startCountdown(); return;
      }
    } catch(e){}
  }
  document.getElementById('rateSt').textContent = '⚠️ سعر تقريبي';
  document.getElementById('rateSpin').style.display = 'none';
  refreshSYP(); startCountdown();
}

function startCountdown() {
  if (cdTimer) clearInterval(cdTimer);
  let s = 600;
  const el = document.getElementById('rateCd');
  cdTimer = setInterval(()=>{
    s--;
    el.textContent = `تحديث بعد ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    if (s<=0){clearInterval(cdTimer);fetchRate();}
  },1000);
}

/* ══ HELPERS ══ */
function fmtSYP(usd) {
  const v = Math.round(usd * RATE);
  if (v >= 1000000) return (v/1000000).toFixed(1).replace('.0','')+'M';
  if (v >= 1000)    return Math.round(v/1000)+'K';
  return v.toLocaleString();
}
function arrowOf(p, pp) {
  if (!pp || p===pp) return {sym:'→',cls:'same'};
  return p>pp ? {sym:'↑',cls:'up'} : {sym:'↓',cls:'down'};
}

/* ══ BUILD CARDS ══ */
function buildCards() {

    card.className = 'brand-card';
    card.dataset.bid = brand.id;
    card.style.animationDelay = (bi*.07)+'s';

    const fbHtml = `<div class="brand-logo-fb" style="background:${brand.color}">${brand.name.slice(0,3).toUpperCase()}</div>`;
    const logoHtml = brand.logo
      ? `<img class="brand-logo-img" src="${brand.logo}" alt="${brand.name}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
         >${fbHtml.replace('display:flex','display:none')}`
      : fbHtml;

    const preview = brand.phones.slice(0,6);
    const extra   = brand.phones.slice(6);
    const tbId    = 'tb-'+brand.id;

    function rowHtml(ph, hidden) {
      const a = arrowOf(ph.p, ph.pp);
      return `<tr class="${hidden?'rh':''}" data-usd="${ph.p}" data-prev="${ph.pp}">
        <td class="tdm" title="${ph.m}">${ph.m}</td>
        <td class="tdr">${ph.r||'—'}</td>
        <td class="tds">${ph.s||'—'}</td>
        <td class="tdu" style="color:${brand.color}">$${ph.p.toLocaleString()}</td>
        <td class="tdk"><span class="syp-inner">
          <span class="arr ${a.cls}">${a.sym}</span>
          <span class="syp-num">${fmtSYP(ph.p)}</span>
        </span></td>
      </tr>`;
    }

    card.innerHTML = `
      <div class="card-header">
        ${logoHtml}
        <div class="brand-text">
          <div class="brand-name">${brand.name}</div>
          <div class="brand-count">${brand.phones.length} موديل</div>
        </div>
        <div class="card-icon">📱</div>
      </div>
      <table class="price-table">
        <colgroup>
          <col class="cm"><col class="cr"><col class="cs"><col class="cu"><col class="ck">
        </colgroup>
        <thead><tr>
          <th class="thm">الموديل</th>
          <th class="thr">الرام</th>
          <th class="ths">التخزين</th>
          <th class="thu">$ دولار</th>
          <th class="thk">↕ ل.س</th>
        </tr></thead>
        <tbody id="${tbId}">
          ${preview.map(ph=>rowHtml(ph,false)).join('')}
          ${extra.map(ph=>rowHtml(ph,true)).join('')}
        </tbody>
      </table>
      ${extra.length ? `<button class="more-btn" style="color:${brand.color}"
        data-open="0" onclick="toggleMore(this,'${tbId}',${extra.length})">
        عرض المزيد (${extra.length} موديل) ↓</button>` : ''}`;
    grid.appendChild(card);
  });
}

function refreshSYP() {
  document.querySelectorAll('tr[data-usd]').forEach(row => {
    const usd=+row.dataset.usd, prev=+row.dataset.prev;
    const valEl=row.querySelector('.syp-num'), arrEl=row.querySelector('.arr');
    if (valEl) valEl.textContent = fmtSYP(usd);
    if (arrEl) { const a=arrowOf(usd,prev); arrEl.textContent=a.sym; arrEl.className='arr '+a.cls; }
  });
}

function toggleMore(btn, tbId, n) {
  const open = btn.dataset.open==='1';
  if (open) {
    let i=0;
    document.querySelectorAll(`#${tbId} tr`).forEach(r=>{ if(i++>=6) r.classList.add('rh'); });
  } else {
    document.querySelectorAll(`#${tbId} tr.rh`).forEach(r=>r.classList.remove('rh'));
  }
  btn.dataset.open = open?'0':'1';
  btn.textContent  = open ? `عرض المزيد (${n} موديل) ↓` : 'عرض أقل ↑';
}

/* ══ FILTERS & SEARCH ══ */
let activeF = 'all';

function buildFilters() {
  const bar = document.getElementById('filtersBar');
  DATA.forEach(b => {
    const btn = document.createElement('button');
    btn.className='fbtn'; btn.dataset.bid=b.id; btn.textContent=b.name;
    btn.onclick=()=>setFilter(b.id);
    bar.appendChild(btn);
  });
  document.querySelector('[data-bid="all"]').onclick=()=>setFilter('all');
}
function setFilter(id) {
  activeF = id;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active',b.dataset.bid===id));
  document.querySelectorAll('.brand-card').forEach(c=>
    c.style.display=(id==='all'||c.dataset.bid===id)?'':'none');
}

document.getElementById('searchInput').addEventListener('input', function(){
  const q=this.value.toLowerCase().trim();
  let any=false;
  document.querySelectorAll('.brand-card').forEach(card=>{
    if(activeF!=='all'&&card.dataset.bid!==activeF)return;
    let hit=false;
    card.querySelectorAll('tr[data-usd]').forEach(row=>{
      const show=!q||row.querySelector('.tdm').textContent.toLowerCase().includes(q);
      row.style.display=show?'':'none';
      if(show){hit=true;any=true;}
    });
    card.style.display=(q&&!hit)?'none':'';
  });
  document.getElementById('noResults').style.display=(q&&!any)?'block':'none';
});

/* ══ INIT ══ */
buildFilters();
buildCards();
fetchRate();
</script>
</body>
</html>
