<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أسعار الهواتف في سورية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f2f0eb; --surface:#fff; --surface2:#f8f6f2;
  --ink:#18150f; --muted:#6b6257; --light:#b0a89e;
  --accent:#c9a84c; --green:#1a9e5c; --red:#d93f3f;
  --border:#e5e0d8; --shadow:rgba(24,21,15,.07); --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo','Tajawal',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;direction:rtl;}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 10% 10%,rgba(201,168,76,.13) 0%,transparent 50%),
             radial-gradient(ellipse at 90% 90%,rgba(26,158,92,.07) 0%,transparent 50%);
}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 80px;position:relative;z-index:1;}

/* HERO */
.hero{text-align:center;padding:52px 20px 32px;}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--accent);font-size:11px;font-weight:700;letter-spacing:2px;padding:6px 18px;border-radius:100px;margin-bottom:20px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
h1{font-family:'Tajawal',sans-serif;font-size:clamp(36px,6.5vw,80px);font-weight:900;line-height:1.05;margin-bottom:10px;}
h1 em{font-style:normal;color:var(--accent);}
.sub{font-size:14px;color:var(--muted);margin-bottom:22px;}

/* RATE BAR */
.rate-bar{display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:#fff;padding:10px 22px;border-radius:100px;font-size:13px;font-weight:600;margin-bottom:22px;flex-wrap:wrap;justify-content:center;}
.rate-label{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:1px;}
.rate-val{font-family:'Tajawal',sans-serif;font-size:17px;font-weight:800;}
.rate-sep{width:1px;height:18px;background:rgba(255,255,255,.2);}
.rate-status{font-size:10px;color:rgba(255,255,255,.45);}
.rate-spin{width:8px;height:8px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg)}}
.countdown{font-size:10px;color:rgba(255,255,255,.35);font-family:'Tajawal',sans-serif;}

/* SEARCH */
.search-box{max-width:480px;margin:0 auto 16px;position:relative;}
.search-box input{width:100%;padding:14px 46px 14px 20px;border:2px solid var(--border);border-radius:100px;background:var(--surface);font-family:'Cairo',sans-serif;font-size:14px;color:var(--ink);outline:none;direction:rtl;transition:border-color .2s,box-shadow .2s;}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(201,168,76,.12);}
.search-box input::placeholder{color:var(--light);}
.si{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;}

/* FILTERS */
.filters{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:30px;}
.fbtn{padding:7px 16px;border:2px solid var(--border);border-radius:100px;background:var(--surface);font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s;}
.fbtn:hover,.fbtn.on{background:var(--ink);border-color:var(--ink);color:#fff;}

/* STATS */
.stats{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;padding:16px 28px;background:var(--surface);border-radius:var(--r);border:1px solid var(--border);max-width:640px;margin:0 auto 38px;box-shadow:0 4px 18px var(--shadow);}
.st{text-align:center;}
.st-n{font-size:22px;font-weight:800;font-family:'Tajawal',sans-serif;}
.st-l{font-size:10px;color:var(--muted);margin-top:1px;}
.sdiv{width:1px;background:var(--border);}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
@media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.grid{grid-template-columns:1fr;}}

/* CARD */
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;box-shadow:0 3px 18px var(--shadow);transition:transform .3s,box-shadow .3s;animation:fadeUp .5s ease both;}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 44px rgba(24,21,15,.12);}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* CARD HEADER */
.card-top{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 13px;border-bottom:1px solid var(--border);}
.bi{display:flex;align-items:center;gap:12px;}
.brand-img{height:32px;max-width:80px;object-fit:contain;display:block;}
.brand-fallback{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;letter-spacing:-.5px;}
.bname{font-size:17px;font-weight:800;font-family:'Tajawal',sans-serif;}
.bcnt{font-size:10px;color:var(--muted);margin-top:1px;}

/* TABLE HEADER — 5 columns */
.thead{
  display:grid;
  grid-template-columns: minmax(120px,1fr) 64px 70px 78px 108px;
  padding:6px 14px;background:var(--surface2);
  font-size:10px;font-weight:700;color:var(--muted);
  border-bottom:1px solid var(--border);gap:4px;
}
.tc{text-align:center;}
.tl{text-align:left;direction:ltr;}

/* PHONE ROW */
.prow{
  display:grid;
  grid-template-columns: minmax(120px,1fr) 64px 70px 78px 108px;
  align-items:center;padding:8px 14px;
  border-bottom:1px solid var(--border);gap:4px;
  transition:background .15s;
}
.prow:last-child{border-bottom:none;}
.prow:hover{background:var(--surface2);}
.prow.gone{display:none!important;}

.pn{font-size:12.5px;font-weight:600;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pram{font-size:11px;color:var(--light);text-align:center;white-space:nowrap;}
.pstor{font-size:11px;color:var(--light);text-align:center;white-space:nowrap;}
.pusd{font-size:13px;font-weight:800;text-align:left;direction:ltr;font-family:'Tajawal',sans-serif;white-space:nowrap;}
.psyp-wrap{display:flex;align-items:center;gap:3px;direction:ltr;justify-content:flex-start;}
.psyp{font-size:11px;font-weight:700;font-family:'Tajawal',sans-serif;color:var(--muted);white-space:nowrap;}
.arrow{font-size:12px;line-height:1;flex-shrink:0;font-weight:900;}
.arrow.up{color:var(--green);}
.arrow.down{color:var(--red);}
.arrow.same{color:var(--light);}

/* SHOW MORE */
.more-btn{display:flex;align-items:center;justify-content:center;padding:11px;background:none;border:none;border-top:1px solid var(--border);font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;cursor:pointer;width:100%;transition:background .15s;}
.more-btn:hover{background:var(--surface2);}

#loading{text-align:center;padding:70px;color:var(--muted);font-size:15px;}
.empty{text-align:center;padding:40px;color:var(--muted);display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="badge"><span class="dot"></span>تحديث تلقائي كل 10 دقائق</div>
    <h1>أسعار الهواتف<br>في <em>سورية</em></h1>
    <p class="sub">أحدث الموديلات · أفضل الأسعار · بالدولار والليرة السورية</p>

    <div class="rate-bar">
      <span class="rate-label">سعر الدولار</span>
      <span class="rate-val" id="rateVal">—</span>
      <span style="color:var(--accent);font-size:12px;">ل.س</span>
      <div class="rate-sep"></div>
      <div style="display:flex;flex-direction:column;gap:2px;align-items:flex-start;">
        <span class="rate-status" id="rateStatus">جاري جلب السعر...</span>
        <span class="countdown" id="countdownEl"></span>
      </div>
      <div class="rate-spin" id="rateSpin"></div>
    </div>

    <div class="search-box">
      <input id="q" type="text" placeholder="ابحث... iPhone 17، Galaxy S26، Poco X8"/>
      <span class="si">🔍</span>
    </div>
    <div class="filters" id="filters">
      <button class="fbtn on" data-brand="all">الكل</button>
    </div>
  </div>

  <div class="stats" id="stats" style="display:none">
    <div class="st"><div class="st-n" id="s1">—</div><div class="st-l">ماركة</div></div>
    <div class="sdiv"></div>
    <div class="st"><div class="st-n" id="s2">—</div><div class="st-l">موديل</div></div>
    <div class="sdiv"></div>
    <div class="st"><div class="st-n" id="s3">—</div><div class="st-l">أقل سعر $</div></div>
    <div class="sdiv"></div>
    <div class="st"><div class="st-n" id="s4">—</div><div class="st-l">أعلى سعر $</div></div>
  </div>

  <div id="loading">⏳ جاري تحميل الأسعار...</div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">😕 لا توجد نتائج</div>
</div>

<script>
/* ══ EXCHANGE RATE ══ */
let rate = null;
let cdTimer = null;

async function fetchRate() {
  document.getElementById('rateSpin').style.display = '';
  document.getElementById('rateStatus').textContent = 'جاري جلب السعر...';

  const SOURCES = [
    // Try exchangerate-api (free, no key needed for basic)
    async () => {
      const r = await fetch('https://open.er-api.com/v6/latest/USD', {signal:AbortSignal.timeout(6000)});
      const d = await r.json();
      if (d.rates && d.rates.SYP) return d.rates.SYP;
      return null;
    },
    // Try frankfurter (no SYP but fallback)
    async () => {
      // scrape sp-today via proxy
      const proxies = [
        'https://api.allorigins.win/raw?url=',
        'https://corsproxy.io/?',
      ];
      for (const p of proxies) {
        try {
          const r = await fetch(p + encodeURIComponent('https://sp-today.com/'), {signal:AbortSignal.timeout(7000)});
          const html = await r.text();
          // sp-today patterns
          const pats = [
            /class="[^"]*rate[^"]*"[^>]*>\s*([\d,]+)/i,
            /الدولار[^\d]*([\d,]{4,7})/,
            /USD[^\d]*([\d,]{4,7})/i,
            /\b(1[2-9]\d{3}|[2-9]\d{4})\b/,
          ];
          for (const pat of pats) {
            const m = html.match(pat);
            if (m) {
              const v = parseFloat(m[1].replace(/,/g,''));
              if (v > 8000 && v < 500000) return v;
            }
          }
        } catch(e) {}
      }
      return null;
    }
  ];

  for (const src of SOURCES) {
    try {
      const val = await src();
      if (val && val > 8000) {
        rate = val;
        document.getElementById('rateVal').textContent = Math.round(val).toLocaleString('en-US');
        document.getElementById('rateStatus').textContent = '✓ محدّث';
        document.getElementById('rateSpin').style.display = 'none';
        updateAllSYP();
        startCountdown();
        return;
      }
    } catch(e) {}
  }

  // Hard fallback
  if (!rate) {
    rate = 13500;
    document.getElementById('rateVal').textContent = (13500).toLocaleString('en-US') + ' *';
    document.getElementById('rateStatus').textContent = '⚠️ سعر تقريبي';
  }
  document.getElementById('rateSpin').style.display = 'none';
  updateAllSYP();
  startCountdown();
}

function startCountdown() {
  if (cdTimer) clearInterval(cdTimer);
  let secs = 600;
  const el = document.getElementById('countdownEl');
  cdTimer = setInterval(() => {
    secs--;
    const m = Math.floor(secs/60), s = secs%60;
    el.textContent = `تحديث بعد ${m}:${String(s).padStart(2,'0')}`;
    if (secs <= 0) { clearInterval(cdTimer); fetchRate(); }
  }, 1000);
}

/* ══ MD PARSER — fixed to handle all header keywords ══ */
function parseMD(text) {
  const lines = text.split('\n');
  const result = { updated:'', brands:[] };
  let brand = null;
  // All possible Arabic header column names — rows matching these are skipped
  const SKIP = ['الموديل','اسم الموديل','model','السعر','الرام','التخزين'];

  for (const raw of lines) {
    const t = raw.trim();
    if (!t) continue;
    if (t.startsWith('updated:')) { result.updated = t.replace('updated:','').trim(); continue; }
    if (t.startsWith('# ')) continue;
    if (t.startsWith('## ')) {
      brand = { name:t.replace('## ','').trim(), color:'#888', logo:'', phones:[] };
      result.brands.push(brand);
      continue;
    }
    if (!brand) continue;
    if (t.startsWith('color:')) { brand.color = t.replace('color:','').trim(); continue; }
    if (t.startsWith('logo:'))  { brand.logo  = t.replace('logo:','').trim();  continue; }

    if (t.startsWith('|')) {
      // Skip separator rows (---|---|...)
      if (t.replace(/[\|\-\s]/g,'') === '') continue;

      const cols = t.split('|').map(c=>c.trim()).filter(Boolean);
      if (cols.length < 4) continue;

      // Skip any header row
      if (SKIP.includes(cols[0])) continue;

      const model    = cols[0];
      const ram      = (cols[1]==='—'||cols[1]==='-') ? '' : cols[1];
      const storage  = (cols[2]==='—'||cols[2]==='-') ? '' : cols[2];
      const price    = parseInt(cols[3].replace(/\D/g,''), 10);
      const prevPrice= cols[4] ? parseInt(cols[4].replace(/\D/g,''), 10) : price;

      if (!model || isNaN(price) || price < 1) continue;
      brand.phones.push({ model, ram, storage, price, prevPrice });
    }
  }
  return result;
}

/* ══ SYP HELPER ══ */
function toSYP(usd) {
  if (!rate) return '—';
  return Math.round(usd * rate).toLocaleString('en-US');
}

function arrowCls(price, prev) {
  if (!prev || price === prev) return ['→','same'];
  return price > prev ? ['↑','up'] : ['↓','down'];
}

/* ══ RENDER ══ */
let allData = null;
let activeBrand = 'all';

function render(brands) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  brands.forEach((b, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.brand = b.name;
    card.style.animationDelay = (i*.07)+'s';

    const preview = b.phones.slice(0,6);
    const extra   = b.phones.slice(6);

    const logoHTML = b.logo
      ? `<img class="brand-img" src="${b.logo}" alt="${b.name}"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'brand-fallback',style:'background:${b.color}',textContent:'${b.name.substring(0,3).toUpperCase()}'}))">`
      : `<div class="brand-fallback" style="background:${b.color}">${b.name.substring(0,3).toUpperCase()}</div>`;

    card.innerHTML = `
      <div class="card-top">
        <div class="bi">
          ${logoHTML}
          <div>
            <div class="bname">${b.name}</div>
            <div class="bcnt">${b.phones.length} موديل</div>
          </div>
        </div>
        <div style="font-size:28px;opacity:.1">📱</div>
      </div>
      <div class="thead">
        <div>الموديل</div>
        <div class="tc">الرام</div>
        <div class="tc">التخزين</div>
        <div class="tl">$ دولار</div>
        <div class="tl">ل.س ليرة</div>
      </div>
      <div id="pl-${i}">
        ${preview.map(p=>makeRow(p,b.color)).join('')}
        ${extra.map(p=>makeRow(p,b.color,true)).join('')}
      </div>
      ${extra.length ? `<button class="more-btn" style="color:${b.color}" data-open="0"
        onclick="toggleMore(this,'pl-${i}',${extra.length})">
        عرض المزيد (${extra.length} موديل) ↓</button>` : ''}
    `;
    grid.appendChild(card);
  });
}

function makeRow(p, color, hidden=false) {
  const [arrow, cls] = arrowCls(p.price, p.prevPrice);
  const syp = toSYP(p.price);
  return `<div class="prow${hidden?' gone':''}" data-usd="${p.price}" data-prev="${p.prevPrice||p.price}">
    <span class="pn" title="${p.model}">${p.model}</span>
    <span class="pram">${p.ram||'—'}</span>
    <span class="pstor">${p.storage||'—'}</span>
    <span class="pusd" style="color:${color}">$${p.price.toLocaleString()}</span>
    <div class="psyp-wrap">
      <span class="arrow ${cls}">${arrow}</span>
      <span class="psyp syp-cell">${syp}</span>
    </div>
  </div>`;
}

function updateAllSYP() {
  document.querySelectorAll('.prow').forEach(row => {
    const usd  = parseFloat(row.dataset.usd);
    const prev = parseFloat(row.dataset.prev);
    const sypEl   = row.querySelector('.syp-cell');
    const arrowEl = row.querySelector('.arrow');
    if (sypEl)   sypEl.textContent = toSYP(usd);
    if (arrowEl) {
      const [arrow, cls] = arrowCls(usd, prev);
      arrowEl.textContent = arrow;
      arrowEl.className   = 'arrow ' + cls;
    }
  });
}

function toggleMore(btn, listId, n) {
  const open = btn.dataset.open==='1';
  document.querySelectorAll(`#${listId} .gone`).forEach(r=>r.classList.toggle('gone',open));
  btn.dataset.open = open?'0':'1';
  btn.textContent  = open ? `عرض المزيد (${n} موديل) ↓` : 'عرض أقل ↑';
}

/* ══ FILTERS & SEARCH ══ */
function buildFilters() {
  const bar = document.getElementById('filters');
  allData.brands.forEach(b => {
    const btn = document.createElement('button');
    btn.className='fbtn'; btn.dataset.brand=b.name; btn.textContent=b.name;
    btn.onclick=()=>applyBrand(b.name);
    bar.appendChild(btn);
  });
  document.querySelector('[data-brand="all"]').onclick=()=>applyBrand('all');
}
function applyBrand(brand) {
  activeBrand = brand;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('on',b.dataset.brand===brand));
  document.querySelectorAll('.card').forEach(c=>c.style.display=(brand==='all'||c.dataset.brand===brand)?'':'none');
}
document.getElementById('q').addEventListener('input',function(){
  const q=this.value.toLowerCase().trim();
  let any=false;
  document.querySelectorAll('.card').forEach(card=>{
    if(activeBrand!=='all'&&card.dataset.brand!==activeBrand)return;
    let hit=false;
    card.querySelectorAll('.prow').forEach(r=>{
      const show=!q||r.querySelector('.pn').textContent.toLowerCase().includes(q);
      r.style.display=show?'':'none';
      if(show){hit=true;any=true;}
    });
    card.style.display=(q&&!hit)?'none':'';
  });
  document.getElementById('empty').style.display=(q&&!any)?'block':'none';
});

/* ══ STATS ══ */
function showStats() {
  const all=allData.brands.flatMap(b=>b.phones).map(p=>p.price);
  document.getElementById('s1').textContent=allData.brands.length;
  document.getElementById('s2').textContent=all.length+'+';
  document.getElementById('s3').textContent='$'+Math.min(...all).toLocaleString();
  document.getElementById('s4').textContent='$'+Math.max(...all).toLocaleString();
  document.getElementById('stats').style.display='flex';
}

/* ══ INIT ══ */
async function init() {
  try {
    const res = await fetch('prices.md');
    if (!res.ok) throw new Error();
    allData = parseMD(await res.text());

    if (!allData.brands.length) throw new Error('no brands');
    const total = allData.brands.reduce((s,b)=>s+b.phones.length,0);
    if (!total) throw new Error('no phones');

    document.getElementById('loading').style.display='none';
    showStats();
    buildFilters();
    render(allData.brands);
  } catch(e) {
    document.getElementById('loading').innerHTML='❌ خطأ في تحميل prices.md — '+e.message;
    return;
  }
  fetchRate();
}
init();
</script>
</body>
</html>
